name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pandas: "pandas>=2.1,<3"
          - python: "3.13"
            pandas: "pandas>=3"
    name: Python ${{ matrix.python }} / ${{ matrix.pandas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "${{ matrix.pandas }}"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (including golden outputs)
        run: python -m pytest -q
