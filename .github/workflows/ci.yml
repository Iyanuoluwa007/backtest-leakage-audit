name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so a new library release that shifts a golden output shows up

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pandas: "pandas>=2.1,<3"
          - python: "3.14"
            pandas: "pandas>=3"
          - python: "3.15" # arch has no 3.15 wheel yet, so its tests skip here
            pandas: "pandas>=3"
    name: Python ${{ matrix.python }} / ${{ matrix.pandas }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "${{ matrix.pandas }}"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (including all golden outputs, Monte Carlo too)
        env:
          RUN_SLOW: "1"
        run: python -m pytest -q
