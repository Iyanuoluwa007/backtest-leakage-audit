[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "backtest-leakage-audit"
version = "2.0.0"
description = "Catch look-ahead bias and overfitting in trading backtests with a future-scramble test, the deflated Sharpe ratio and a bootstrap data-snooping test."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oke Iyanuoluwa E." }]
keywords = ["backtesting", "look-ahead bias", "overfitting", "sharpe ratio", "quantitative finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "arch>=8; python_version < '3.15'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
backtest-leakage-audit = "backtest_leakage_audit.cli:main"

[project.urls]
Homepage = "https://github.com/Iyanuoluwa007/backtest-leakage-audit"
Changelog = "https://github.com/Iyanuoluwa007/backtest-leakage-audit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Iyanuoluwa007/backtest-leakage-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_leakage_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backtest_leakage_audit"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
